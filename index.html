<script>
(() => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const form = document.getElementById('gate'), btn = document.getElementById('go'), err = document.getElementById('err');
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Opening…';
    try {
      const pw = new TextEncoder().encode(document.getElementById('pw').value);
      const base = await crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c));
      const html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    } catch (x) {
      err.textContent = window.crypto && crypto.subtle ? 'Wrong password, try again.' : 'Your browser blocks decryption on this address. Open the page over https.';
      btn.disabled = false; btn.textContent = 'Open';
    }
  });
})();
</script>
